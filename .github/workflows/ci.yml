name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install the pinned Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  linux-appimage:
    name: Linux AppImage (x86_64, T1–T3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install the pinned Rust toolchain
        run: rustup show
      - run: pnpm install --frozen-lockfile
      - name: Cross-platform round-trip regression
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked linux_functional_round_trip
      - name: T1 build and inspect AppImage
        run: pnpm package:linux-local
      - name: T2 rendered smoke + T3 real Ghostty AppImage loop
        timeout-minutes: 15
        run: pnpm test:linux-appimage
      - uses: actions/upload-artifact@v6
        with:
          name: ghostty-studio-linux-x86_64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
